name: Conferir NUCOM no navegador
on:
  push:
    paths: ['.github/workflows/exportar-marcas.yml']
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install playwright pillow
      - run: python -m http.server 8765 --bind 127.0.0.1 >/tmp/nucom-http.log 2>&1 &
      - name: Conferir desktop, celular e interações
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import base64, io, shutil
          from PIL import Image
          with sync_playwright() as p:
              browser = p.chromium.launch(executable_path=shutil.which("google-chrome") or shutil.which("chromium"),args=["--no-sandbox"])
              page = browser.new_page(viewport={"width":1365,"height":860}, device_scale_factor=1)
              errors = []
              page.on("pageerror", lambda e: errors.append(str(e)))
              page.on("response", lambda res: errors.append(str(res.status)+" "+res.url) if res.status >= 400 else None)
              page.goto("http://127.0.0.1:8765")
              page.wait_for_function("document.querySelector('.loader').hidden && document.querySelector('.face img').naturalWidth > 0")
              page.wait_for_timeout(600)
              def shot(name):
                  im=Image.open(io.BytesIO(page.screenshot(type="png")))
                  im.thumbnail((800,620))
                  out=io.BytesIO()
                  im.convert("RGB").save(out,format="JPEG",quality=80)
                  s=base64.b64encode(out.getvalue()).decode()
                  for i in range(0,len(s),2048):
                      print("VISTA",name,i,s[i:i+2048])
              shot("desktop")
              assert page.locator("h1").inner_text().replace("\n"," ").strip()
              page.get_by_role("button",name="Pausar movimento").click()
              t=page.locator(".rotor").evaluate("(el)=>el.style.transform")
              page.wait_for_timeout(250)
              assert t==page.locator(".rotor").evaluate("(el)=>el.style.transform")
              box=page.locator(".mark").bounding_box()
              x,y=box["x"]+box["width"]/2,box["y"]+box["height"]/2
              page.mouse.move(x,y);page.mouse.down();page.mouse.move(x+65,y+10,steps=8);page.mouse.up()
              assert t!=page.locator(".rotor").evaluate("(el)=>el.style.transform")
              page.get_by_role("button",name="Ativar movimento").click()
              page.locator(".mark").click()
              page.wait_for_function("parseFloat(document.querySelector('.rotor').style.transform.match(/translateY\\(([-.0-9]+)/)[1]) < -4")
              for el in page.locator(".selector button").all():
                  el.click()
                  el.evaluate("(e)=>e.scrollIntoView({behavior:'instant',block:'center'})")
                  page.wait_for_function("path=>document.querySelector('.viewer img').getAttribute('src').endsWith(path)",arg=el.get_attribute("data-src"))
              for el in page.locator(".cover img").all():
                  el.scroll_into_view_if_needed()
                  assert el.evaluate("im=>im.decode().then(()=>im.naturalWidth>0)")
              page.set_viewport_size({"width":390,"height":844})
              page.emulate_media(reduced_motion="reduce")
              page.goto("http://127.0.0.1:8765")
              assert page.locator(".loader").is_hidden()
              assert page.get_by_role("button",name="Ativar movimento").is_visible()
              assert page.evaluate("document.documentElement.scrollWidth <= innerWidth")
              shot("mobile")
              print("NUCOM QA", "aprovado", "erros", errors)
              assert not errors, errors
              browser.close()
