name: Validar layout do NUCOM
on:
  push:
    paths: ['.github/workflows/conferir-layout.yml', 'assets/movimento.js', 'assets/site.css']
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install playwright
      - run: python -m http.server 8765 --bind 127.0.0.1 >/tmp/nucom-http.log 2>&1 &
      - shell: python
        run: |
          from playwright.sync_api import sync_playwright
          import shutil
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which("google-chrome"),args=["--no-sandbox"])
              page=browser.new_page()
              errors=[]
              page.on("pageerror", lambda error: (errors.append(str(error)), print("JS ERROR", error)))
              page.on("response", lambda response: errors.append(response.url) if response.status>=400 else None)
              page.goto("http://127.0.0.1:8765")
              page.wait_for_function("document.querySelector('.loader').hidden")
              page.evaluate("document.fonts.ready")
              assert page.locator("header .word").inner_text()=="Nucom"
              assert page.locator(".kicker").inner_text()=="Secretaria da educação de Rio Claro SP"
              assert page.locator("header .city-logo,footer .city-logo").count()==2
              assert page.locator(".rail").count()==0
              assert page.locator(".hero").evaluate("el=>getComputedStyle(el).backgroundColor")=="rgb(255, 255, 255)"
              for width in [320,375,390,560,605,681,768,1024,1280,1440,1920]:
                  page.set_viewport_size({"width":width,"height":860})
                  page.wait_for_timeout(100)
                  geometry=page.locator(".title-line").last.evaluate("""el=>{
                    const chars=[...el.children], line=el.getBoundingClientRect();
                    const rect=chars.at(-1).getBoundingClientRect();
                    return [Math.max(...chars.map(c=>c.offsetTop))-Math.min(...chars.map(c=>c.offsetTop)),rect.right-line.right,document.documentElement.scrollWidth-innerWidth];
                  }""")
                  assert geometry[0]<2 and geometry[1]<2 and geometry[2]<2,(width,geometry)
              for panel in page.locator(".show-panel").all():
                  panel.focus()
                  assert panel.get_attribute("aria-pressed")=="true"
              page.set_viewport_size({"width":390,"height":844})
              page.locator(".show-panel").nth(1).tap() if page.evaluate("navigator.maxTouchPoints") else page.locator(".show-panel").nth(1).click()
              assert page.locator(".show-panel").nth(1).get_attribute("aria-pressed")=="true"
              assert page.locator(".show-gallery").evaluate("el=>getComputedStyle(el).flexDirection")=="column"
              page.emulate_media(reduced_motion="reduce")
              page.reload()
              assert page.locator(".loader").is_hidden()
              for img in page.locator("img").all():
                  img.evaluate("el=>{el.loading='eager';return el.decode()}")
              assert not errors,errors
              print("Aprovado: assinatura original em dois pontos, hero branca, título em 11 larguras, galeria e movimento reduzido.")
              browser.close()
